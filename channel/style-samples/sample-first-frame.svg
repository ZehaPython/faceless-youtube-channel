<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141B3C"/><stop offset="1" stop-color="#2A2F6B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2EC4B6" stop-opacity="0.45"/><stop offset="1" stop-color="#2EC4B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fluid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2EC4B6"/><stop offset="1" stop-color="#1E8F9C"/>
    </linearGradient>
    <clipPath id="brainClip"><path d="M330 1000 C250 990 230 880 290 830 C270 740 350 680 420 700 C450 630 560 620 600 680 C670 640 770 690 760 770 C830 800 840 900 780 950 C790 1010 720 1050 660 1030 C620 1070 520 1070 480 1030 C430 1060 350 1050 330 1000 Z"/></clipPath>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#B8B5FF">
    <circle cx="120" cy="300" r="5"/><circle cx="960" cy="380" r="4"/><circle cx="880" cy="620" r="6"/>
    <circle cx="160" cy="700" r="4"/><circle cx="990" cy="1100" r="5"/><circle cx="90" cy="1250" r="6"/>
    <circle cx="300" cy="1560" r="4"/><circle cx="820" cy="1650" r="5"/>
  </g>
  <!-- moon -->
  <circle cx="890" cy="300" r="70" fill="#FFD23F"/><circle cx="925" cy="275" r="62" fill="#141B3C"/>
  <!-- hook text -->
  <g font-family="Nunito, 'Baloo 2', 'Inter Display', Inter, sans-serif" font-weight="900" text-anchor="middle" font-size="104" fill="#F7F4EA">
    <text x="500" y="380">Your Brain</text>
    <text x="500" y="495"><tspan fill="#FFD23F">Washes</tspan> Itself</text>
    <text x="500" y="610">Every Night</text>
  </g>
  <!-- glow + pillow -->
  <circle cx="530" cy="900" r="430" fill="url(#glow)"/>
  <ellipse cx="530" cy="1150" rx="360" ry="70" fill="#B8B5FF" opacity="0.9"/>
  <!-- brain -->
  <path d="M330 1000 C250 990 230 880 290 830 C270 740 350 680 420 700 C450 630 560 620 600 680 C670 640 770 690 760 770 C830 800 840 900 780 950 C790 1010 720 1050 660 1030 C620 1070 520 1070 480 1030 C430 1060 350 1050 330 1000 Z" fill="#FF8A9A"/>
  <g clip-path="url(#brainClip)">
    <path d="M200 960 Q330 920 450 965 T700 960 T900 955 V1200 H200 Z" fill="url(#fluid)" opacity="0.95"/>
    <path d="M200 985 Q330 950 450 990 T700 985 T900 980" stroke="#F7F4EA" stroke-width="8" fill="none" opacity="0.6"/>
  </g>
  <g stroke="#E0607A" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M400 760 Q450 800 420 860"/><path d="M560 720 Q520 780 570 830"/><path d="M690 780 Q640 830 690 880"/>
  </g>
  <!-- sleeping face -->
  <g stroke="#141B3C" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M455 900 Q480 922 505 900"/><path d="M575 900 Q600 922 625 900"/>
  </g>
  <circle cx="540" cy="945" r="9" fill="#141B3C"/>
  <!-- Zzz -->
  <g font-family="Nunito, 'Inter Display', sans-serif" font-weight="900" fill="#B8B5FF">
    <text x="780" y="700" font-size="56">z</text><text x="825" y="640" font-size="72">z</text><text x="880" y="565" font-size="90">Z</text>
  </g>
  <!-- bubbles -->
  <g fill="none" stroke="#2EC4B6" stroke-width="7">
    <circle cx="300" cy="880" r="22"/><circle cx="250" cy="790" r="14"/><circle cx="800" cy="900" r="18"/><circle cx="760" cy="1000" r="12"/>
  </g>
  <g fill="#F7F4EA" opacity="0.8"><circle cx="294" cy="873" r="6"/><circle cx="794" cy="894" r="5"/></g>
</svg>
