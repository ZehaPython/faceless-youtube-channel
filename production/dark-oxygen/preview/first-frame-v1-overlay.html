<!doctype html>
<html><head><meta charset="utf-8">

<style>

    font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:104px;line-height:1.08;
    color:#E9DCC0;text-shadow:0 4px 18px rgba(0,0,0,.65)}
  .hook b{color:#FFB347;font-weight:800}

<body><div class="art"></div><div class="shade"></div>
